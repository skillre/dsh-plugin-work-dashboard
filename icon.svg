<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Work Dashboard">
  <defs>
    <linearGradient id="wd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7BF0" />
      <stop offset="1" stop-color="#1B4FC2" />
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="84" height="84" rx="20" fill="url(#wd-bg)" />
  <!-- Dashboard board: two metric tiles above, one wide row below -->
  <rect x="18" y="22" width="27" height="22" rx="6" fill="#ffffff" opacity="0.95" />
  <rect x="51" y="22" width="27" height="22" rx="6" fill="#ffffff" opacity="0.62" />
  <rect x="18" y="50" width="60" height="12" rx="5" fill="#ffffff" opacity="0.82" />
  <rect x="18" y="66" width="38" height="9" rx="4" fill="#ffffff" opacity="0.42" />
  <!-- Accent mark: the current module -->
  <circle cx="27.5" cy="33" r="3.4" fill="#218568" />
  <circle cx="60.5" cy="33" r="3.4" fill="#C9D8F5" />
</svg>
